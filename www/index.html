<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b6cff">
<title>我会唱 · 我的私人曲库</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="title-row">
      <h1>🎤 我会唱</h1>
      <span class="sub">我的 KTV 曲库</span>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="设置">⚙️</button>
    </div>
    <div class="search-row">
      <div class="search-box">
        <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M21 21l-4.3-4.3M10.5 17a6.5 6.5 0 100-13 6.5 6.5 0 000 13z"/></svg>
        <input id="searchInput" type="search" placeholder="搜歌名、歌手" enterkeyhint="search" autocomplete="off">
        <button id="clearBtn" class="clear-btn" type="button" aria-label="清空" hidden>×</button>
      </div>
      <button id="searchBtn" class="search-btn" type="button">搜索</button>
    </div>
  </header>

  <div class="filter-row" id="filterRow">
    <button class="chip active" data-filter="all" type="button">全部</button>
    <button class="chip" data-filter="artist" type="button">按歌手</button>
    <button class="chip" data-filter="tag" type="button">按标签</button>
  </div>

  <main id="main" class="main"></main>

  <nav class="bottomnav">
    <button class="nav-item active" data-mode="library" type="button"><span class="nav-ico">🎵</span><span>我的曲库</span></button>
    <button class="nav-item" data-mode="order" type="button"><span class="nav-ico">🎤</span><span>点歌</span></button>
    <button class="nav-item" data-mode="stats" type="button"><span class="nav-ico">📊</span><span>统计</span></button>
  </nav>
</div>

<div class="overlay" id="detailOverlay" hidden>
  <div class="sheet">
    <header class="sheet-header">
      <button id="detailBack" class="back-btn" type="button">‹ 返回</button>
      <div class="sheet-title">歌曲详情</div>
      <span class="spacer"></span>
    </header>
    <div class="sheet-body" id="detailBody"></div>
  </div>
</div>

<div class="overlay" id="settingsOverlay" hidden>
  <div class="sheet">
    <header class="sheet-header">
      <button id="settingsBack" class="back-btn" type="button">‹ 返回</button>
      <div class="sheet-title">设置</div>
      <span class="spacer"></span>
    </header>
    <div class="sheet-body" id="settingsBody"></div>
  </div>
</div>

<div class="overlay" id="orderHistoryOverlay" hidden>
  <div class="sheet">
    <header class="sheet-header">
      <button id="orderHistoryBack" class="back-btn" type="button">‹ 返回</button>
      <div class="sheet-title">点歌历史</div>
      <span class="spacer"></span>
    </header>
    <div class="sheet-body" id="orderHistoryBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal-card" id="modalCard"></div>
</div>

<div class="toast" id="toast" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
